[project]
name = "backend"
version = "0.1.0"
description = "NotALawyer API: contract review with AI, backed by a vector database of Canadian law"
authors = [
    { name = "Kami", email = "pin.inci@hotmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.143.0",
    "openai>=3.32.0",
    "pdfplumber>=0.11.10",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "sentence-transformers>=6.1.0",
    "sqlalchemy>=2.1.4",
    # Listed directly, though sentence-transformers needs it, so the CPU index below applies.
    "torch>=2.14.1",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
]

# CPU-only PyTorch on every platform. The embedding model is small, and PyPI's Linux
# wheels bring about 3 GB of CUDA libraries that a server without a GPU can't use.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
